<div class="mt-10 pt-8 border-t border-white/20">
    <h2 class="text-xl font-bold mb-4">Create Employee Account</h2>
    <div class="flex flex-col gap-3">
        <input type="text" id="new-user" placeholder="New Username" class="p-3 rounded-lg bg-white/10 outline-none">
        <input type="password" id="new-pass" placeholder="New Password" class="p-3 rounded-lg bg-white/10 outline-none">
        <button onclick="createUser()" class="bg-pink-500 p-3 rounded-lg font-bold">CREATE ACCOUNT</button>
    </div>
</div>

<script>
async function createUser() {
    const username = document.getElementById('new-user').value;
    const password = document.getElementById('new-pass').value;
    await fetch('/api/admin/create-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
    });
    alert("User Created!");
}
</script>

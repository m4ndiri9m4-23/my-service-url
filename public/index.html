<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #4338ca, #7e22ce, #db2777); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 2rem; }
    </style>
</head>
<body>
    <div class="glass p-10 w-full max-w-sm shadow-2xl text-center">
        <h1 class="text-3xl font-bold mb-6">Welcome</h1>
        <div class="space-y-4">
            <input type="text" id="user" placeholder="Username" class="w-full p-4 rounded-xl bg-white/10 outline-none border border-white/20">
            <input type="password" id="pass" placeholder="Password" class="w-full p-4 rounded-xl bg-white/10 outline-none border border-white/20">
            <button onclick="login()" class="w-full bg-indigo-600 p-4 rounded-xl font-bold hover:bg-indigo-500 transition">LOG IN</button>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (data.success) alert("Access Granted!");
            else alert("Invalid Login");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4338ca, #7e22ce, #db2777);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 2rem;
        }
    </style>
</head>
<body class="text-white p-6">
    <div class="glass p-10 w-full max-w-sm shadow-2xl text-center">
        <div class="mb-6">
            <div class="bg-white/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-4xl">🔐</span>
            </div>
            <h1 class="text-3xl font-bold">Welcome</h1>
            <p class="text-white/60 text-sm mt-2">Sign in to continue</p>
        </div>

        <div class="space-y-4">
            <input type="text" id="username" placeholder="Username" 
                class="w-full p-4 rounded-xl bg-white/10 border border-white/20 outline-none focus:border-pink-400 transition">
            
            <input type="password" id="password" placeholder="Password" 
                class="w-full p-4 rounded-xl bg-white/10 border border-white/20 outline-none focus:border-pink-400 transition">
            
            <button onclick="handleLogin()" id="loginBtn"
                class="w-full bg-gradient-to-r from-indigo-500 to-pink-500 p-4 rounded-xl font-bold shadow-lg hover:scale-105 transition active:scale-95">
                LOG IN
            </button>
        </div>
        
        <p id="error-msg" class="text-red-300 text-sm mt-4 hidden"></p>
    </div>

    <script>
        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            // Note: In a real app, this URL would come from your setup screen
            const baseUrl = window.location.origin; 

            try {
                const response = await fetch(`${baseUrl}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (data.success) {
                    alert("Success! Redirecting...");
                    // window.location.href = "/dashboard.html"; // Where users go after login
                } else {
                    errorMsg.innerText = data.message;
                    errorMsg.classList.remove('hidden');
                }
            } catch (err) {
                alert("Server connection failed.");
            }
        }
    </script>
</body>
</html>
